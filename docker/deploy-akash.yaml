---
version: "2.0"
services:
  timescaledb:
    image: >-
      ghcr.io/zhajingwen/hyperliquid-pair-coins-realtime-analyze/timescaledb-akash:latest
    expose:
      - port: 5432
        as: 80
        to:
          - global: true
    env:
      - POSTGRES_DB=crypto_data
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=CHANGE_ME_STRONG_PASSWORD_123
      - TIMESCALEDB_TELEMETRY=off
      - TZ=UTC
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    params:
      storage:
        data:
          mount: /mnt/data
          readOnly: false
profiles:
  compute:
    timescaledb:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 1Gi
        storage:
          - size: 5Gi
          - name: data
            size: 5Gi
            attributes:
              persistent: true
              class: beta3
  placement:
    dcloud:
      pricing:
        timescaledb:
          denom: uakt
          amount: 10000
deployment:
  timescaledb:
    dcloud:
      profile: timescaledb
      count: 1
